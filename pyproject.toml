[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishora"
version = "0.1.0"
description = "Fishora: fish identification RAG backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-multipart",
    "pillow",
    "httpx",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "pgvector",
    "openai",
    "langchain-core",
    "langchain-huggingface",
    "langchain-openai>=0.3.9",
    "sentence-transformers",
]

[project.optional-dependencies]
cv = ["torch", "torchvision", "timm"]
# The species-ID evaluation suite (evaluation/cv): reports, figures, and fish masks (rembg).
cv-eval = ["matplotlib", "pandas", "scikit-learn", "scipy", "rembg"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["apps*", "scripts*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
markers = [
    "integration: requires a running PostgreSQL/pgvector database",
    "real_artifact: requires real dataset artifacts on disk",
    "unit: pure logic, no model or network",
    "retrieval: retrieval quality gates over the real corpus and E5",
    "generation: critic grounding and card-pipeline gates",
    "api: FastAPI app with in-memory ports (no database)",
    "e2e: HTTP flow from photo to grounded card, plus the dashboard",
]
